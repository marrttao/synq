[package]
name = "synq"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
lofty = "0.25.5"
notify = "8.2.1"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "query", "rustls"] }
rodio = { version = "0.23.0", default-features = false, features = ["flac", "mp3", "mp4", "playback", "vorbis", "wav"] }
rubato = { version = "5.0.1", optional = true }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "isomp4", "aac"], optional = true }
tachyonfx = { version = "0.25.2", default-features = false }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
whisper-rs = { version = "0.16.0", features = ["log_backend"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["whisper"]
# Local speech recognition. Without it the player works, just without Whisper.
whisper = ["dep:whisper-rs", "dep:rubato", "dep:symphonia"]
