[package]
name = "synq"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
lofty = "0.25.5"
notify = "8.2.1"
ratatui = "0.30.2"
rodio = { version = "0.23.0", default-features = false, features = ["flac", "mp3", "mp4", "playback", "vorbis", "wav"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
